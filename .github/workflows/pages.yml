# Publica la app en GitHub Pages en cada push.
# Requisito único: Settings → Pages → Source: "GitHub Actions".
name: Publicar en GitHub Pages
on:
  push:
    branches: [main, claude/escaner-libre-pwa-ds97wf]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar el sitio (solo los archivos de la app)
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js .nojekyll css js icons fonts _site/
          mkdir _site/planificador
          cp -r planificador/index.html planificador/manifest.webmanifest planificador/sw.js planificador/css planificador/js planificador/icons planificador/fonts _site/planificador/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
